<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ashmup</title>
  </head>
  <body>
    <div id="info-panel">
      <h3>information panel</h3>
      <div class="info-group">
        <h3>controls</h3>
        <ul>
          <li><span class="key">E</span><span class="divider"></span><span class="action">move up</span></li>
          <li><span class="key">S</span><span class="divider"></span><span class="action">move left</span></li>
          <li><span class="key">D</span><span class="divider"></span><span class="action">move down</span></li>
          <li><span class="key">F</span><span class="divider"></span><span class="action">move right</span></li>
          <li><span class="key">Space</span><span class="divider"></span><span class="action">move faster</span></li>
          <li><span class="key">C</span><span class="divider"></span><span class="action">toggle this panel</span></li>
          <li><span class="key">P</span><span class="divider"></span><span class="action">toggle dev info</span></li>
        </ul>
      </div>

      <div class="info-group">
        <h3>goal</h3>
        <p>collect the shapes in order</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
